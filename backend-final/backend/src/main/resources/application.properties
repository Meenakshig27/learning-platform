spring.application.name=learning-platform
server.port=${PORT:8080}

# MySQL: change the password (root) to YOUR MySQL password. The database is created automatically.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learning_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates and updates the tables for you
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.error.include-message=always

# JWT (secret must be 32+ characters)
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long}
app.jwt.expiration-ms=86400000

# Frontend URLs allowed to call this API
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,https://meenakshig27.github.io}
